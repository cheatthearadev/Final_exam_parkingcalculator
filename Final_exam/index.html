
<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parking Calculator</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link href="https://fonts.googleapis.com/css2?family=Battambang:wght@400;700&display=swap" rel="stylesheet">

    <style>
        body {
            background: #f8f8f8;
            font-family: 'Battambang', sans-serif;
        }

        .main-container {
            max-width: 1100px;
            margin: 40px auto;
        }

        .calculator, .price-info {
            background: #3f4886;
            padding: 35px;
            min-height: 570px;
        }

        .calculator h4 {
            color: white;
            text-align: center;
            margin-bottom: 40px;
        }

        .form-control, .form-select {
            height: 55px;
            border: 1.5px solid #333;
            border-radius: 10px;
            background: transparent;
            font-size: 17px;
        }

        .form-control:focus, .form-select:focus {
            border-color: #c91e1e;
            box-shadow: none;
        }

        .form-label {
            font-size: 16px;
        }

        .btn-calculate {
            background: #c91e1e;
            color: white;
            height: 55px;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            width: 100%;
        }

        .btn-calculate:hover {
            background: #a81717;
            color: white;
        }

        .price-info {
            padding: 90px 40px;
        }

        .price-info h5 {
            margin-bottom: 15px;
        }

        .price-info p {
            line-height: 2;
            font-size: 17px;
            margin-left: 30px;
        }

        .result {
            background: rgba(255,255,255,0.5);
            padding: 15px;
            border-radius: 10px;
            margin-top: 20px;
            display: none;
        }

        @media(max-width: 768px) {
            .main-container {
                margin: 15px auto;
            }

            .calculator, .price-info {
                min-height: auto;
                padding: 25px;
            }

            .price-info {
                padding: 35px 25px;
            }
        }
    </style>
</head>

<body>

<div class="container main-container">

    <div class="row g-4">

        <!-- Calculator -->
        <div class="col-md-6">

            <div class="calculator">

                <h4>គណនាថ្លៃចតយានយន្ត</h4>

                <div class="row align-items-center mb-4">
                    <div class="col-5">
                        <label class="form-label">ប្រភេទយានយន្ត:</label>
                    </div>

                    <div class="col-7">
                        <select id="vehicle" class="form-select">
                            <option value="car">ឡាន</option>
                            <option value="motorcycle">ម៉ូតូ</option>
                        </select>
                    </div>
                </div>

                <div class="row align-items-center mb-4">
                    <div class="col-5">
                        <label class="form-label">ម៉ោងចូល:</label>
                    </div>

                    <div class="col-7">
                        <input type="time" id="startTime" class="form-control">
                    </div>
                </div>

                <div class="row align-items-center mb-4">
                    <div class="col-5">
                        <label class="form-label">ម៉ោងចេញ:</label>
                    </div>

                    <div class="col-7">
                        <input type="time" id="endTime" class="form-control">
                    </div>
                </div>

                <div class="row align-items-center mb-4">
                    <div class="col-5">
                        <label class="form-label">ថ្លៃជារៀល:</label>
                    </div>

                    <div class="col-7">
                        <input type="text" id="riel" class="form-control" readonly>
                    </div>
                </div>

                <div class="row align-items-center mb-4">
                    <div class="col-5">
                        <label class="form-label">ថ្លៃជាដុល្លារ:</label>
                    </div>

                    <div class="col-7">
                        <input type="text" id="dollar" class="form-control" readonly>
                    </div>
                </div>

                <button class="btn-calculate" onclick="calculate()">
                    គណនា
                </button>

                <div id="result" class="result text-center">
                    <strong id="hours"></strong>
                </div>

                <div id="message" class="text-danger mt-3"></div>

            </div>
        </div>


        <!-- Price Information -->
        <div class="col-md-6">

            <div class="price-info">

                <h5>ឡាន</h5>

                <p>
                    + ចតក្នុងរយៈពេល 8h
                    ⇒ 1h = 500៛
                    <br>
                    + ចតលើសពី 8h
                    ⇒ 1h = 1000៛
                </p>

                <br>

                <h5>ម៉ូតូ</h5>

                <p>
                    + ចតក្នុងរយៈពេល 8h
                    ⇒ 1h = 200៛
                    <br>
                    + ចតលើសពី 8h
                    ⇒ 1h = 300៛
                </p>

                <hr>

                <p class="ms-0">
                    អត្រាប្តូរប្រាក់៖ 1$ = 4000៛
                </p>

            </div>
        </div>

    </div>
</div>


<script>

function calculate() {

    let vehicle = document.getElementById("vehicle").value;
    let startTime = document.getElementById("startTime").value;
    let endTime = document.getElementById("endTime").value;

    let message = document.getElementById("message");
    let result = document.getElementById("result");

    if (startTime === "" || endTime === "") {
        message.innerText = "សូមបញ្ចូលម៉ោងចូល និងម៉ោងចេញ!";
        result.style.display = "none";
        return;
    }

    let start = startTime.split(":");
    let end = endTime.split(":");

    let startMinutes = Number(start[0]) * 60 + Number(start[1]);
    let endMinutes = Number(end[0]) * 60 + Number(end[1]);

    let totalMinutes = endMinutes - startMinutes;

    if (totalMinutes <= 0) {
        totalMinutes += 1440;
    }

    let hours = Math.ceil(totalMinutes / 60);

    let price = 0;

    if (vehicle === "car") {
        price = hours <= 8 ? 500 : 1000;
    } else {
        price = hours <= 8 ? 200 : 300;
    }

    let totalRiel = hours * price;
    let totalDollar = totalRiel / 4000;

    document.getElementById("riel").value =
        totalRiel.toLocaleString() + " ៛";

    document.getElementById("dollar").value =
        "$ " + totalDollar.toFixed(2);

    document.getElementById("hours").innerText =
        "រយៈពេលចតសរុប: " + hours + " ម៉ោង";

    message.innerText = "";
    result.style.display = "block";

}

</script>

</body>
</html>
