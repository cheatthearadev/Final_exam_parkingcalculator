<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parking Fee Calculator</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #f8f8f8;
            font-family: Arial, sans-serif;
        }

        .main-container {
            max-width: 1100px;
            margin: 40px auto;
        }

        .calculator,
        .price-info {
            background: #14919f;
            padding: 35px;
            min-height: 570px;
            border-radius: 10px;
        }

        .form-control,
        .form-select {
            height: 55px;
            border: 1.5px solid #333;
            border-radius: 10px;
        }

        .calculate-btn {
            background: #c91e1e;
            color: white;
            height: 50px;
            border-radius: 10px;
            font-weight: bold;
        }

        .calculate-btn:hover {
            background: #a81717;
            color: white;
        }

        .result-box {
            background: white;
            padding: 15px;
            border-radius: 10px;
            margin-top: 20px;
        }

        @media (max-width: 768px) {
            .main-container {
                margin: 20px auto;
            }

            .calculator,
            .price-info {
                min-height: auto;
                padding: 25px;
            }
        }
    </style>
</head>

<body>

<div class="container main-container">
    <div class="row g-4">

        <div class="col-md-6">
            <div class="calculator">
                <h2 class="text-center mb-4">Parking Fee Calculator</h2>

                <div class="mb-3">
                    <label class="form-label fw-bold">Vehicle Type</label>
                    <select id="vehicle" class="form-select">
                        <option value="car">Car</option>
                        <option value="motorcycle">Motorcycle</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold">Start Time</label>
                    <input type="time" id="startTime" class="form-control">
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold">End Time</label>
                    <input type="time" id="endTime" class="form-control">
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold">Total Fee (Riel)</label>
                    <input type="text" id="riel" class="form-control" readonly>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold">Total Fee (Dollar)</label>
                    <input type="text" id="dollar" class="form-control" readonly>
                </div>

                <button onclick="calculate()" class="btn calculate-btn w-100">
                    Calculate
                </button>

                <div class="result-box text-center">
                    <h5>Total Parking Hours</h5>
                    <h3 id="hours">0 Hours</h3>
                    <p id="message" class="mb-0 text-danger"></p>
                </div>
            </div>
        </div>


    </div>
</div>

<script>
    function calculate() {
        let vehicle = document.getElementById("vehicle").value;
        let startTime = document.getElementById("startTime").value;
        let endTime = document.getElementById("endTime").value;

        let rielInput = document.getElementById("riel");
        let dollarInput = document.getElementById("dollar");
        let hoursDisplay = document.getElementById("hours");
        let message = document.getElementById("message");

        if (startTime === "" || endTime === "") {
            message.innerText = "Please select start time and end time!";
            return;
        }

        let start = startTime.split(":");
        let end = endTime.split(":");

        let startMinutes = Number(start[0]) * 60 + Number(start[1]);
        let endMinutes = Number(end[0]) * 60 + Number(end[1]);

        let totalMinutes = endMinutes - startMinutes;

        if (totalMinutes < 0) {
            totalMinutes += 24 * 60;
        }

        if (totalMinutes === 0) {
            message.innerText = "Start time and end time cannot be the same!";
            return;
        }

        let hours = Math.ceil(totalMinutes / 60);

        let pricePerHour = 0;

        if (vehicle === "car") {
            pricePerHour = hours <= 8 ? 500 : 1000;
        } else {
            pricePerHour = hours <= 8 ? 200 : 300;
        }

        let totalRiel = hours * pricePerHour;
        let totalDollar = totalRiel / 4000;

        rielInput.value = totalRiel.toLocaleString() + " ៛";
        dollarInput.value = "$" + totalDollar.toFixed(2);

        hoursDisplay.innerText = hours + " Hours";
        message.innerText = "";
    }
</script>

</body>
</html>
